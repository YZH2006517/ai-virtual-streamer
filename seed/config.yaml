# AI 唠嗑主播 的默认配置。界面「设置」里改的内容保存在 data/settings.json，会覆盖这里的同名项。
name: 小柚

llm:
  base_url: https://api.deepseek.com
  model: deepseek-chat
  api_key: ""

tts:
  engine: edge
  voice: zh-CN-XiaoyiNeural
  rate: "+10%"
  pitch: "+10Hz"

avatar:
  image: ""
  video: ""
  live2d: data/avatars/live2d/PinkSakura/PinkSakura.model3.json

avatar_kind: live2d

render:
  mode: live2d

vad:
  silence_ms: 600

av:
  offset_ms: 0

live:
  port: 17860
  device: ""
  monitor: true
  mode: chat
  persona: yuanqi
  bg: "@chat:suncafe"
  theme:
    preset: candy

persona: |
  你是"小柚"，一个友好、活泼的 AI 数字人主播。用口语回答，每次 1 到 3 句话，不用列表和表情符号。
